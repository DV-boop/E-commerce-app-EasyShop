# Required project identification
sonar.projectKey=ecom
sonar.projectName=e-commerce
sonar.projectVersion=1.0

# Source code location
sonar.sources=.

# Language & encoding
sonar.language=js
sonar.sourceEncoding=UTF-8

# Optional - You can ignore node_modules or dist folders
sonar.exclusions=**/node_modules/**, **/dist/**

# Optional - If using tests
# sonar.tests=tests
# sonar.test.inclusions=**/*.spec.js,**/*.test.js

# Optional - Report paths if you're using coverage tools (e.g., Jest, Istanbul)
# sonar.javascript.lcov.reportPaths=coverage/lcov.info
